name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Publish a GitHub release with this tag (leave empty to only build)'
        required: false
        default: 'v1.1'
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RouterGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "RouterGuard-$TAG.apk"
          gh release create "$TAG" "RouterGuard-$TAG.apk" --target "$GITHUB_SHA" \
            --title "Router Guard $TAG" \
            --notes "Android app for the Huawei HG8546M. Install the APK on your phone (allow installs from unknown sources), join your home Wi-Fi and sign in with your router login."
