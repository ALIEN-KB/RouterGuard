name: Build APK
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: RouterGuard-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
      - name: Publish GitHub release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "RouterGuard-${{ github.ref_name }}.apk"
          gh release create "${{ github.ref_name }}" "RouterGuard-${{ github.ref_name }}.apk" \
            --title "Router Guard ${{ github.ref_name }}" \
            --notes "Android app for the Huawei HG8546M. Install the APK on your phone (allow installs from unknown sources), join your home Wi-Fi and sign in with your router login."
